<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="d-mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bff230"/>
      <stop offset="50%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#5a8d00"/>
    </linearGradient>
  </defs>

  <!-- 전체 배경 (가장자리 크롭되어도 그라데이션 검정으로 안전) -->
  <rect width="512" height="512" fill="url(#bg-mask)"/>

  <!-- Safe zone: 102 ~ 410 (80%) — 모든 시각 요소가 이 안에 있어야 안 짤림 -->

  <!-- 중앙 D — 일반 아이콘보다 작게 + 안전 영역 안 -->
  <path
    d="M 168 152 L 168 360 L 290 360 C 354 360 396 318 396 256 C 396 194 354 152 290 152 Z M 230 214 L 230 298 L 290 298 C 322 298 334 282 334 256 C 334 230 322 214 290 214 Z"
    fill="url(#d-mask)"
    fill-rule="evenodd"
  />
</svg>
